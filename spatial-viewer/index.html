                      <image href="assets/floor_plan.svg" width={SVG_WIDTH} height={SVG_HEIGHT} />
                    </g>

                    {/* LAYER 2: Duct Layer (#00E5FF, 4px) */}
                    <g filter={ductGlow ? 'url(#duct-glow)' : undefined}>
                      <path d={DUCT_PATHS.mainLoop} fill="none" stroke="#005B66" strokeWidth="10" opacity="0.4" />
                      {DUCT_PATHS.spines.map((s, i) => (
                        <path key={`c-${i}`} d={s} fill="none" stroke="#005B66" strokeWidth="10" opacity="0.4" />
                      ))}
                      <path d={DUCT_PATHS.mainLoop} fill="none" stroke="#00E5FF" strokeWidth="4" />
                      {DUCT_PATHS.spines.map((s, i) => (
                        <path key={`s-${i}`} d={s} fill="none" stroke="#00E5FF" strokeWidth="4" />
                      ))}
                    </g>

                    {/* LAYER 3: Dynamic Annotation Pins */}
                    <g>
                      {leaks.map(leak => {
                        const cx = (leak.xPercent / 100) * SVG_WIDTH;
                        const cy = (leak.yPercent / 100) * SVG_HEIGHT;
                        const isSelected = selectedLeakId === leak.id;
                        const config = SEVERITY_CONFIG[leak.severity] || SEVERITY_CONFIG['No Leak'];

                        return (
                          <g
                            key={leak.id}
                            className={`map-pin-group ${isSelected ? 'is-selected' : ''}`}
                            transform={`translate(${cx}, ${cy})`}
                            onClick={(e) => { e.stopPropagation(); setSelectedLeakId(leak.id); }}
                            onMouseEnter={(e) => { e.stopPropagation(); }}
                            onMouseLeave={(e) => { e.stopPropagation(); }}
                            onMouseDown={(e) => { e.stopPropagation(); }}
                            cursor="pointer"
                          >
                            {isSelected && (
                              <circle cx="0" cy="0" r="34" fill="none" stroke="#00E5FF" strokeWidth="3" strokeDasharray="6 4" pointerEvents="none" />
                            )}
                            {config.pulse && (
                              <circle cx="0" cy="0" r="28" fill={config.color} className="pin-pulse-wave" opacity="0.3" pointerEvents="none" />
                            )}
                            <circle cx="0" cy="0" r="18" fill={config.color} stroke={isSelected ? '#00E5FF' : (leak.severity === 'No Leak' ? '#00E5FF' : '#FFFFFF')} strokeWidth={isSelected ? '3' : (leak.severity === 'No Leak' ? '3' : '2.5')} />
                            <text x="0" y="1" textAnchor="middle" dominantBaseline="middle" fill={leak.severity === 'No Leak' ? '#0000B3' : '#FFFFFF'} fontSize="13" fontWeight="bold" pointerEvents="none">
                              {leak.severity === 'Critical' || leak.severity === 'High' ? '!' : leak.severity === 'Medium' ? '▲' : leak.severity === 'Low' ? '●' : '✓'}
                            </text>
                            <g transform="translate(0, -28)">
                              <rect x="-50" y="-14" width="100" height="22" rx="11" fill="#0D1629" stroke={isSelected ? '#00E5FF' : config.borderColor} strokeWidth={isSelected ? '2' : '1.5'} />
                              <text x="0" y="-1" textAnchor="middle" dominantBaseline="middle" fill="#FFFFFF" fontSize="10" fontWeight="bold" pointerEvents="none">
                                {leak.roomNumber.replace('Room ', '')} · {Math.round(leak.fusedConfidence)}%
                              </text>
                            </g>
                          </g>
                        );
                      })}

                      {isSelectingLocation && ghostCoords && (
                        <g transform={`translate(${ghostCoords.x}, ${ghostCoords.y})`} opacity="0.85" pointerEvents="none">
                          <circle cx="0" cy="0" r="20" fill="#00E5FF" />
                          <text x="0" y="1" textAnchor="middle" dominantBaseline="middle" fill="#0000B3" fontSize="12" fontWeight="bold">📍</text>
                        </g>
                      )}
                    </g>
                  </svg>
                </div>
              </div>

              {/* Dynamic Scale Indicator */}
              <div className="spatial-scale-indicator">
                <div className="scale-header">
                  <span>📐 Scale: 1m = {(20 * zoom).toFixed(1)}px</span>
                </div>
                <div className="scale-bar-wrapper">
                  <div className="scale-ticks">
                    <span>0</span>
                    <span>2.5m</span>
                    <span>5m</span>
                  </div>
                  <div className="scale-bar" style={{ width: `${scaleWidth}px` }}>
                    <div className="segment-left"></div>
                    <div className="segment-right"></div>
                  </div>
                </div>
                <div className="scale-footer">Zoom: {Math.round(zoom * 100)}%</div>
              </div>
            </div>

            {/* QA Inspection Drawer */}
            {selectedLeak && (
              <aside className="inspection-drawer">
                <div className="drawer-header" style={{ borderLeftColor: SEVERITY_CONFIG[selectedLeak.severity]?.borderColor }}>
                  <div>
                    <div className="drawer-pre-title">QA INSPECTION PANEL</div>
                    <h2 className="drawer-room-title">{selectedLeak.roomNumber}</h2>
                  </div>
                  <button className="btn-drawer-close" onClick={() => setSelectedLeakId(null)}>✕</button>
                </div>

                <div className="drawer-severity-strip" style={{ backgroundColor: SEVERITY_CONFIG[selectedLeak.severity]?.bgColor, borderColor: SEVERITY_CONFIG[selectedLeak.severity]?.borderColor }}>
                  <div className="severity-badge-large" style={{ color: SEVERITY_CONFIG[selectedLeak.severity]?.textColor }}>
                    <span className="dot" style={{ backgroundColor: SEVERITY_CONFIG[selectedLeak.severity]?.color }}></span>
                    <span>{selectedLeak.severity} Severity</span>
                  </div>
                  <div className="fused-score-pill" style={{ color: SEVERITY_CONFIG[selectedLeak.severity]?.textColor }}>
                    <span>Fused:</span>
                    <strong>{selectedLeak.fusedConfidence.toFixed(1)}%</strong>
                  </div>
                </div>

                <div className="drawer-body">
                  <div className="metric-card">
                    <div className="metric-header">
                      <span className="metric-title">Fused Overall Leak Confidence</span>
                      <span className="metric-score" style={{ color: SEVERITY_CONFIG[selectedLeak.severity]?.textColor }}>
                        {selectedLeak.fusedConfidence.toFixed(1)}%
                      </span>
                    </div>
                    <div className="confidence-track">
                      <div className="confidence-fill" style={{ width: `${selectedLeak.fusedConfidence}%`, backgroundColor: SEVERITY_CONFIG[selectedLeak.severity]?.color }}></div>
                    </div>
                    <div className="confidence-scale-labels">
                      <span>Safe (0%)</span>
                      <span>30%</span>
                      <span>50%</span>
                      <span>70%</span>
                      <span>Critical (85%+)</span>
                    </div>
                  </div>

                  <div>
                    <h3 className="section-heading">📡 Individual Sensor Breakdown</h3>
                    <div className="sensor-grid">
                      <div className="sensor-card">
                        <div className="sensor-top">
                          <span>🌡️ Thermal Sensor</span>
                          <span className="sensor-weight">40% wt</span>
                        </div>
                        <div className="sensor-val-row">
                          <span className="sensor-percent">{selectedLeak.thermalConfidence}%</span>
                          <span className="sensor-raw-val">{selectedLeak.thermalConfidence >= 70 ? 'Hot Plume' : 'Nominal'}</span>
                        </div>
                        <div className="sensor-bar-track"><div className="thermal-fill" style={{ width: `${selectedLeak.thermalConfidence}%` }}></div></div>
                      </div>

                      <div className="sensor-card">
                        <div className="sensor-top">
                          <span>💨 Diff. Pressure</span>
                          <span className="sensor-weight">30% wt</span>
                        </div>
                        <div className="sensor-val-row">
                          <span className="sensor-percent">{selectedLeak.pressureConfidence}%</span>
                          <span className="sensor-raw-val">{selectedLeak.pressureValuePa.toFixed(1)} Pa</span>
                        </div>
                        <div className="sensor-bar-track"><div className="pressure-fill" style={{ width: `${selectedLeak.pressureConfidence}%` }}></div></div>
                      </div>

                      <div className="sensor-card">
                        <div className="sensor-top">
                          <span>🔊 Acoustic Sensor</span>
                          <span className="sensor-weight">30% wt</span>
                        </div>
                        <div className="sensor-val-row">
                          <span className="sensor-percent">{selectedLeak.audioConfidence}%</span>
                          <span className="sensor-raw-val">{selectedLeak.audioValueDb.toFixed(1)} dB</span>
                        </div>
                        <div className="sensor-bar-track"><div className="audio-fill" style={{ width: `${selectedLeak.audioConfidence}%` }}></div></div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h3 className="section-heading">📷 Rendered Thermal Image Snapshot</h3>
                    <div className="thermal-snapshot-container">
                      <img src={selectedLeak.thermalImagePath} alt="Thermal Anomaly" className="thermal-snapshot-img" onError={(e) => { e.currentTarget.src = 'assets/thermal/room_1851.jpg'; }} />
                      <div className="thermal-overlay-badge">FLIR IR · Ironbow Palette</div>
                    </div>
                  </div>

                  <div>
                    <h3 className="section-heading">📍 Precise Spatial Coordinates</h3>
                    <div className="meta-list">
                      <div className="meta-row">
                        <span className="meta-label">Coordinates (%):</span>
                        <span className="coordinate-pill">X: {selectedLeak.xPercent.toFixed(2)}% · Y: {selectedLeak.yPercent.toFixed(2)}%</span>
                      </div>
                      <div className="meta-row">
                        <span className="meta-label">SVG Anchor:</span>
                        <span className="meta-value">({Math.round(selectedLeak.xPercent * 18.17)} px, {Math.round(selectedLeak.yPercent * 22.55)} px)</span>
                      </div>
                      <div className="meta-row">
                        <span className="meta-label">Timestamp:</span>
                        <span className="meta-value">{selectedLeak.timestamp}</span>
                      </div>
                      <div className="meta-row">
                        <span className="meta-label">Inspector / Node:</span>
                        <span className="meta-value">{selectedLeak.inspector}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="drawer-footer">
                  <button className="btn-drawer-action btn-ack" onClick={() => alert(`Marked ${selectedLeak.roomNumber} as acknowledged!`)}>
                    ✓ Acknowledge QA
                  </button>
                  <button className="btn-drawer-action btn-delete" onClick={() => { setLeaks(prev => prev.filter(l => l.id !== selectedLeak.id)); setSelectedLeakId(null); }}>
                    🗑 Delete Pin
                  </button>
                </div>
              </aside>
            )}

            {/* Manual Leak Modal Form */}
            {isModalOpen && (
              <div className="modal-backdrop" onClick={() => setIsModalOpen(false)}>
                <div className="modal-card" onClick={e => e.stopPropagation()}>
                  <div className="modal-header">
                    <div>
                      <h2 style={{ fontSize: '16px', fontWeight: 800 }}>+ Add Manual Leak Annotation</h2>
                      <p style={{ fontSize: '12px', color: '#94a3b8' }}>Calculate fused severity and place pin on duct network</p>
                    </div>
                    <button className="btn-drawer-close" onClick={() => setIsModalOpen(false)}>✕</button>
                  </div>

                  <form className="modal-form" onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const tConf = Number(form.tConf.value);
                    const pConf = Number(form.pConf.value);
                    const pVal = Number(form.pVal.value);
                    const aConf = Number(form.aConf.value);
                    const aVal = Number(form.aVal.value);
                    const fused = computeFusedConfidence(tConf, pConf, aConf);
                    const sev = determineSeverity(fused);

                    setPendingLeak({
                      roomNumber: form.room.value,
                      thermalConfidence: tConf,
                      thermalImagePath: form.tImg.value,
                      pressureConfidence: pConf,
                      pressureValuePa: pVal,
                      audioConfidence: aConf,
                      audioValueDb: aVal,
                      fusedConfidence: fused,
                      severity: sev,
                      timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                      inspector: 'QA Technician (Manual)',
                      notes: 'Manual field measurement pin'
                    });
                    setIsModalOpen(false);
                    setIsSelectingLocation(true);
                  }}>
                    <div className="form-section">
                      <div className="section-title">🚪 1. Room Number</div>
                      <div className="form-group">
                        <select name="room" className="form-control" defaultValue="Room 1852">
                          <option value="Room 1851">Room 1851</option>
                          <option value="Room 1852">Room 1852</option>
                          <option value="Room 1731">Room 1731</option>
                          <option value="Room 1732">Room 1732</option>
                          <option value="Room 1541">Room 1541</option>
                          <option value="Room 1453">Room 1453</option>
                          <option value="Room 1371">Room 1371</option>
                          <option value="LIBRARY">LIBRARY</option>
                          <option value="Server Room A">Server Room A</option>
                        </select>
                      </div>
                    </div>

                    <div className="form-section">
                      <div className="section-title">🌡️ 2. Thermal Sensor</div>
                      <div className="form-grid-2">
                        <div className="form-group">
                          <label>Confidence (%)</label>
                          <input name="tConf" type="number" min="0" max="100" defaultValue="85" className="form-control" />
                        </div>
                        <div className="form-group">
                          <label>Thermal Image Asset</label>
                          <select name="tImg" className="form-control" defaultValue="assets/thermal/room_1851.jpg">
                            <option value="assets/thermal/room_1851.jpg">Room 1851 (Severe Plume)</option>
                            <option value="assets/thermal/room_1731.jpg">Room 1731 (Joint Seam)</option>
                            <option value="assets/thermal/room_1541.jpg">Room 1541 (Vent Hotspot)</option>
                            <option value="assets/thermal/room_1453.jpg">Room 1453 (Mild Variance)</option>
                            <option value="assets/thermal/room_1371.jpg">Room 1371 (Normal Clean)</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    <div className="form-section">
                      <div className="section-title">💨 3. Differential Pressure</div>
                      <div className="form-grid-2">
                        <div className="form-group">
                          <label>Confidence (%)</label>
                          <input name="pConf" type="number" min="0" max="100" defaultValue="80" className="form-control" />
                        </div>
                        <div className="form-group">
                          <label>Value (Pa)</label>
                          <input name="pVal" type="number" step="0.1" defaultValue="75.0" className="form-control" />
                        </div>
                      </div>
                    </div>

                    <div className="form-section">
                      <div className="section-title">🔊 4. Audio / Acoustic Sensor</div>
                      <div className="form-grid-2">
                        <div className="form-group">
                          <label>Confidence (%)</label>
                          <input name="aConf" type="number" min="0" max="100" defaultValue="75" className="form-control" />
                        </div>
                        <div className="form-group">
                          <label>Value (dB)</label>
                          <input name="aVal" type="number" step="0.1" defaultValue="65.0" className="form-control" />
                        </div>
                      </div>
                    </div>

                    <div className="modal-actions">
                      <button type="button" className="btn-modal-cancel" onClick={() => setIsModalOpen(false)}>Cancel</button>
                      <button type="submit" className="btn-modal-submit">Next: Pin on Map 📍</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
