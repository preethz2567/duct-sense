<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background-color: white;">
  <defs>
    <style>
      .wall { fill: none; stroke: #1a1a1a; stroke-width: 4; }
      .door { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
      .text { font-family: 'Helvetica', sans-serif; fill: #444444; font-size: 16px; font-weight: bold; }
      .duct-main { fill: none; stroke: #107C41; stroke-width: 14; stroke-linecap: square; opacity: 0.8; }
      .duct-branch { fill: none; stroke: #107C41; stroke-width: 8; stroke-linecap: square; opacity: 0.8; }
      .diffuser { fill: #DFF6DD; stroke: #107C41; stroke-width: 2; }
      .ahu { fill: #eeeeee; stroke: #333; stroke-width: 3; }
    </style>
  </defs>

  <!-- Exterior Walls -->
  <rect x="50" y="50" width="900" height="700" class="wall" />
  
  <!-- Interior Walls -->
  <line x1="250" y1="50" x2="250" y2="400" class="wall" />
  <line x1="50" y1="400" x2="1000" y2="400" class="wall" />
  <line x1="500" y1="50" x2="500" y2="400" class="wall" />
  <line x1="750" y1="50" x2="750" y2="400" class="wall" />
  
  <line x1="300" y1="400" x2="300" y2="750" class="wall" />
  <line x1="700" y1="400" x2="700" y2="750" class="wall" />

  <!-- Doors -->
  <rect x="248" y="200" width="4" height="50" class="door" />
  <rect x="498" y="200" width="4" height="50" class="door" />
  <rect x="748" y="200" width="4" height="50" class="door" />
  
  <rect x="300" y="550" width="60" height="4" class="door" />
  <rect x="640" y="550" width="60" height="4" class="door" />

  <!-- Rooms -->
  <text x="150" y="200" class="text" text-anchor="middle">LAB 1</text>
  <text x="375" y="200" class="text" text-anchor="middle">LAB 2</text>
  <text x="625" y="200" class="text" text-anchor="middle">OFFICE</text>
  <text x="875" y="200" class="text" text-anchor="middle">CONFERENCE</text>
  
  <text x="175" y="550" class="text" text-anchor="middle">SERVER RM</text>
  <text x="850" y="550" class="text" text-anchor="middle">AHU PLANT</text>
  <text x="500" y="550" class="text" text-anchor="middle">MAIN CORRIDOR</text>

  <!-- AHU -->
  <rect x="800" y="600" width="100" height="100" class="ahu" />
  <text x="850" y="655" class="text" text-anchor="middle">AHU-A1</text>

  <!-- Ducts -->
  <polyline points="800,650 500,650 500,300" class="duct-main" />
  <polyline points="500,300 150,300 150,150" class="duct-branch" />
  <polyline points="375,300 375,150" class="duct-branch" />
  <polyline points="500,300 625,300 625,150" class="duct-branch" />
  <polyline points="625,300 875,300 875,150" class="duct-branch" />
  <polyline points="500,550 175,550 175,650" class="duct-branch" />

  <!-- Diffusers -->
  <rect x="135" y="135" width="30" height="30" class="diffuser" />
  <rect x="360" y="135" width="30" height="30" class="diffuser" />
  <rect x="610" y="135" width="30" height="30" class="diffuser" />
  <rect x="860" y="135" width="30" height="30" class="diffuser" />
  <rect x="160" y="635" width="30" height="30" class="diffuser" />
  
  <!-- Diffuser Crosses -->
  <line x1="135" y1="135" x2="165" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="165" y1="135" x2="135" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="360" y1="135" x2="390" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="390" y1="135" x2="360" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="610" y1="135" x2="640" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="640" y1="135" x2="610" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="860" y1="135" x2="890" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="890" y1="135" x2="860" y2="165" stroke="#107C41" stroke-width="2" />
  <line x1="160" y1="635" x2="190" y2="665" stroke="#107C41" stroke-width="2" />
  <line x1="190" y1="635" x2="160" y2="665" stroke="#107C41" stroke-width="2" />

</svg>
